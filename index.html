<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キーボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<textarea id="textArea" placeholder="ここに入力されます"></textarea>

<div id="topBar">
  <button id="modeBtn">編集モード</button>
  <button id="openImportBtn">配置を読み込む</button>
  <button id="exportLayoutBtn">座標出力</button>

  <select id="layoutSelect">
  <option value="円形">円形</option>
  <option value="qwerty">qwerty</option>
  <option value="左右分け">左右分け</option>
  <option value="横並び">横並び</option>
  </select>
</div>




<!-- キーボード画面 -->
<div id="keyboardScreen">
  <div id="keyboard"></div>
</div>

<!-- CSV読み込み画面 -->
<div id="csvScreen" style="display:none;">

  <h3>配置データ読み込み</h3>

  <textarea id="layoutInput"
    placeholder="ここに座標データを貼り付けてください"></textarea>

  <button id="importLayoutBtn">配置を読み込む</button>

  <button id="cancelImportBtn">戻る</button>

</div>

<div id="sizePanel" style="display:none;">
  <div>選択中キー: <span id="keyLabel">-</span></div>

  幅:
  <input type="number" id="keyWidth">

  高さ:
  <input type="number" id="keyHeight">

  X:
  <input type="number" id="keyX">

  Y:
  <input type="number" id="keyY">
</div>

<script src="script.js"></script>

</body>
</html>
